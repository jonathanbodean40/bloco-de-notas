<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff"><meta name="description" content="Bloco de notas simples, sincronizado e instalável.">
  <title>Notas Exclusivas Pro</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="app-header">
    <div class="brand"><img src="icon.svg" alt=""><span>Notas Exclusivas Pro</span></div>
    <nav id="top-controls" aria-label="Ações das notas">
      <button id="account-btn" class="icon-btn" type="button" title="Conta e sincronização" aria-label="Conta e sincronização">●</button>
      <button id="toggle-sidebar-btn" class="icon-btn" type="button" title="Ver notas guardadas" aria-label="Ver notas guardadas">☰</button>
      <button id="new-note-btn" class="icon-btn" type="button" title="Criar nova nota" aria-label="Criar nova nota">＋</button>
    </nav>
  </header>
  <div id="history-controls" aria-label="Histórico de edição">
    <button id="undo-btn" type="button" title="Desfazer" aria-label="Desfazer">↶<span>Desfazer</span></button>
    <button id="redo-btn" type="button" title="Refazer" aria-label="Refazer">↷<span>Refazer</span></button>
  </div>
  <button id="close-note-btn" class="icon-btn" type="button" title="Fechar nota" aria-label="Fechar nota">✕</button>

  <dialog id="auth-dialog"><form id="auth-form" method="dialog">
    <div class="dialog-heading"><h2>Sincronização</h2><button id="close-auth-btn" class="plain-btn" type="button" aria-label="Fechar">✕</button></div>
    <p id="auth-description">Entre com a mesma conta no PC e no telemóvel.</p>
    <label>E-mail<input id="auth-email" type="email" autocomplete="email" required></label>
    <label>Palavra-passe<input id="auth-password" type="password" autocomplete="current-password" minlength="6" required></label>
    <p id="auth-message" role="status" aria-live="polite"></p>
    <div id="signed-out-actions" class="dialog-actions"><button id="signup-btn" type="button">Criar conta</button><button id="login-btn" type="submit">Entrar</button></div>
    <div id="signed-in-actions" class="dialog-actions" hidden><button id="sync-btn" type="button">Sincronizar agora</button><button id="logout-btn" type="button">Terminar sessão</button></div>
  </form></dialog>

  <aside id="sidebar" class="sidebar" aria-label="Notas guardadas" aria-hidden="true">
    <div class="sidebar-header"><h2>Notas</h2><button id="close-sidebar-btn" class="plain-btn" type="button" aria-label="Fechar lista de notas">✕</button></div>
    <div id="sidebar-notes-list"></div>
  </aside><div id="sidebar-backdrop" class="backdrop" hidden></div>

  <main><section id="note-form" aria-label="Editor de nota">
    <div id="note-title" contenteditable="true" role="textbox" aria-label="Título da nota" data-placeholder="Título..."></div>
    <div id="note-text" contenteditable="true" role="textbox" aria-label="Texto da nota" aria-multiline="true" data-placeholder="Escreva a sua nota aqui..."></div>
    <div class="bottom-actions"><span id="save-status" role="status" aria-live="polite"></span>
      <button id="delete-btn" type="button" title="Eliminar esta nota" hidden>Eliminar</button>
      <button id="save-btn" class="save-icon-btn" type="button" title="Guardar nota" aria-label="Guardar nota"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l2 2v16H5V3Zm3 2v5h8V5H8Zm0 9v5h8v-5H8Z"/></svg></button>
    </div>
  </section></main>

  <div id="custom-context-menu" class="context-menu" role="menu" aria-label="Formatar texto">
    <div class="format-grid" aria-label="Formatação básica">
      <button type="button" data-command="bold" title="Negrito"><strong>B</strong><span>Negrito</span></button>
      <button type="button" data-command="underline" title="Sublinhado"><u>U</u><span>Sublinhar</span></button>
      <button type="button" data-command="strikeThrough" title="Riscado"><s>S</s><span>Riscado</span></button>
      <button type="button" data-case="upper" title="Maiúsculas">A<span>MAIÚSCULAS</span></button>
      <button type="button" data-case="lower" title="Minúsculas">a<span>minúsculas</span></button>
      <button type="button" data-command="removeFormat" title="Limpar formatação">⌫<span>Limpar</span></button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section"><span>Tamanho da letra</span>
      <div class="font-size-control"><button type="button" data-size-step="-1" aria-label="Diminuir tamanho">A−</button><input id="font-size-input" type="number" min="8" max="96" value="18" aria-label="Tamanho da letra em píxeis"><span>px</span><button type="button" data-size-step="1" aria-label="Aumentar tamanho">A＋</button><button type="button" id="apply-size-btn">Aplicar</button></div>
      <div class="size-row"><button type="button" data-font-px="12">12</button><button type="button" data-font-px="14">14</button><button type="button" data-font-px="16">16</button><button type="button" data-font-px="18">18</button><button type="button" data-font-px="24">24</button><button type="button" data-font-px="32">32</button></div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section"><span>Cor da letra</span><div class="color-row">
      <button type="button" class="color-dot" data-color="#111111" style="--color:#111111" aria-label="Preto"></button><button type="button" class="color-dot" data-color="#e5251f" style="--color:#e5251f" aria-label="Vermelho"></button><button type="button" class="color-dot" data-color="#1565c0" style="--color:#1565c0" aria-label="Azul"></button><button type="button" class="color-dot" data-color="#188038" style="--color:#188038" aria-label="Verde"></button><button type="button" class="color-dot" data-color="#ef6c00" style="--color:#ef6c00" aria-label="Laranja"></button><button type="button" class="color-dot" data-color="#7b1fa2" style="--color:#7b1fa2" aria-label="Roxo"></button><label class="color-picker" title="Mais cores"><input id="text-color-input" type="color" value="#111111" aria-label="Escolher outra cor da letra"><span>＋</span></label>
    </div></div>
    <div class="menu-divider"></div>
    <div class="menu-section"><span>Marcar texto</span><div class="color-row">
      <button type="button" class="color-dot no-color" data-highlight="transparent" aria-label="Retirar marcação">×</button><button type="button" class="color-dot" data-highlight="#fff176" style="--color:#fff176" aria-label="Amarelo"></button><button type="button" class="color-dot" data-highlight="#80deea" style="--color:#80deea" aria-label="Azul claro"></button><button type="button" class="color-dot" data-highlight="#a5d6a7" style="--color:#a5d6a7" aria-label="Verde claro"></button><button type="button" class="color-dot" data-highlight="#f8bbd0" style="--color:#f8bbd0" aria-label="Rosa"></button><button type="button" class="color-dot" data-highlight="#ffcc80" style="--color:#ffcc80" aria-label="Laranja claro"></button><label class="color-picker" title="Mais cores"><input id="highlight-color-input" type="color" value="#fff176" aria-label="Escolher outra cor de marcação"><span>＋</span></label>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script>
</body></html>
