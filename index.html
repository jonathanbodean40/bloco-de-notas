<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Bloco de notas simples e instalável.">
  <title>Notas Exclusivas Pro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top-controls" aria-label="Ações das notas">
    <button id="toggle-sidebar-btn" class="icon-btn" type="button" title="Ver notas guardadas" aria-label="Ver notas guardadas">☰</button>
    <button id="new-note-btn" class="icon-btn" type="button" title="Criar nova nota" aria-label="Criar nova nota">＋</button>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Notas guardadas" aria-hidden="true">
    <div class="sidebar-header">
      <h2>Notas</h2>
      <button id="close-sidebar-btn" class="plain-btn" type="button" aria-label="Fechar lista de notas">✕</button>
    </div>
    <div id="sidebar-notes-list"></div>
  </aside>
  <div id="sidebar-backdrop" class="backdrop" hidden></div>

  <main>
    <section id="note-form" aria-label="Editor de nota">
      <div id="note-title" contenteditable="true" role="textbox" aria-label="Título da nota" data-placeholder="Título..."></div>
      <div id="note-text" contenteditable="true" role="textbox" aria-label="Texto da nota" aria-multiline="true" data-placeholder="Escreva a sua nota aqui..."></div>
      <div class="bottom-actions">
        <span id="save-status" role="status" aria-live="polite"></span>
        <button id="delete-btn" type="button" title="Eliminar esta nota" hidden>Eliminar</button>
        <button id="save-btn" type="button">Guardar nota</button>
      </div>
    </section>
  </main>

  <div id="custom-context-menu" class="context-menu" role="menu" aria-label="Formatar texto">
    <div class="format-grid" aria-label="Formatação básica">
      <button type="button" data-command="bold" title="Negrito"><strong>B</strong><span>Negrito</span></button>
      <button type="button" data-command="undo" title="Desfazer">↶<span>Desfazer</span></button>
      <button type="button" data-command="redo" title="Refazer">↷<span>Refazer</span></button>
      <button type="button" data-command="underline" title="Sublinhado"><u>U</u><span>Sublinhar</span></button>
      <button type="button" data-command="strikeThrough" title="Riscado"><s>S</s><span>Riscado</span></button>
      <button type="button" data-command="removeFormat" title="Limpar formatação">⌫<span>Limpar</span></button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <span>Tamanho</span>
      <div class="size-row">
        <button type="button" data-size="2">Pequeno</button>
        <button type="button" data-size="3">Médio</button>
        <button type="button" data-size="5">Grande</button>
      </div>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <span>Cor</span>
      <div class="color-row">
        <button type="button" class="color-dot" data-color="#111111" style="--color:#111111" aria-label="Preto"></button>
        <button type="button" class="color-dot" data-color="#d93025" style="--color:#d93025" aria-label="Vermelho"></button>
        <button type="button" class="color-dot" data-color="#1a73e8" style="--color:#1a73e8" aria-label="Azul"></button>
        <button type="button" class="color-dot" data-color="#188038" style="--color:#188038" aria-label="Verde"></button>
        <button type="button" class="color-dot" data-color="#e37400" style="--color:#e37400" aria-label="Laranja"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
