name: Signed Android distribution
on:
  push:
    branches: [distribution/android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed release checksum
        shell: bash
        run: |
          echo "b52738e15e801df08d7882eb0f02becdac8b560fe1372c16ffb8620f36a3180e  releases/BlocoNotasPro-Android-1.0.2.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoNotasPro-Android-Signed-Release-1.0.2
          path: releases/BlocoNotasPro-Android-1.0.2.apk
          if-no-files-found: error
          retention-days: 90
