name: Signed Android distribution
on:
  push:
    branches: [distribution/android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed release checksum
        shell: bash
        run: |
          echo "8c12ca8e0ba6e6913b66eb8bae6ce33fa4bb6af3c03d5af0e367662e51de1220  releases/BlocoNotasPro-Android-1.0.4.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoNotasPro-Android-Signed-Release-1.0.4
          path: releases/BlocoNotasPro-Android-1.0.4.apk
          if-no-files-found: error
          retention-days: 90
