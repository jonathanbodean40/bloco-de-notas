name: Signed Android distribution
on:
  push:
    branches: [distribution/android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed release checksum
        shell: bash
        run: |
          echo "84260dda44c662969779b838dcb69532bd370814dc36074e6d7333edfbc97ed1  releases/BlocoNotasPro-Android-1.0.3.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoNotasPro-Android-Signed-Release-1.0.3
          path: releases/BlocoNotasPro-Android-1.0.3.apk
          if-no-files-found: error
          retention-days: 90
