name: Build independent Windows and Android apps
on:
  push:
    branches: [feature/independent-windows-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:independence
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Bloco-Notas-Pro-Windows-test
          path: dist-installers/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run test:independence
      - run: npm run android:sync
      - run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Bloco-Notas-Pro-Android-debug-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
